name: Plugin submission
description: Share a plugin so it can be listed
labels: ["plugin-system", "needs-triage"]
body:
  - type: input
    id: name
    attributes:
      label: Plugin name and id
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Source repository or release URL
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What it does
    validations:
      required: true
  - type: input
    id: api
    attributes:
      label: Required plugin API version
      description: The apiVersion in manifest.json (1 for now).
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA-256 of the .playlish package
      description: Shown in Playlish's install prompt, or from Get-FileHash <file> -Algorithm SHA256.
    validations:
      required: false
  - type: textarea
    id: permissions
    attributes:
      label: Permissions requested and why
      description: List each permission and the reason it is needed (see docs/PLUGINS.md). Plugin API v1 has no network access.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: The plugin has a license and its source is public
          required: true
        - label: It does not alter or capture Spotify audio, or sync music with visual media
          required: true
        - label: It only uses the documented plugin API
          required: true
        - label: The package was made with npm run plugin:pack (so it passes Playlish's install checks)
          required: false
