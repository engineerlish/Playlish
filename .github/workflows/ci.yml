name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the job that comments on pull requests adds pull-requests: write.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts skips downloading the Electron binary (hundreds of MB); typecheck, lint, unit tests and the
      # TypeScript build do not need it. The E2E job will install it.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests with coverage
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=test-results.json

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm run audit:deps

      # main's latest coverage, so the summary can show the change. Missing on the first run; then no change is shown.
      - name: Coverage baseline from main
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$id" ]; then gh run download "$id" --repo "$GITHUB_REPOSITORY" --name ci-reports --dir coverage-baseline || echo "No baseline on main yet."; fi

      - name: Write summary
        if: always()
        shell: bash
        run: |
          node scripts/ci-summary.mjs ci-summary.md
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Failed or flaky tests on main become issues (#14), one per failure, as github-actions[bot] with the built-in token.
      # Pull request failures are not filed: they are in the pull request's own summary.
      - name: File issues for failed or flaky tests
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON tools/issues/ci-report.ts --vitest test-results.json

      # Same-repository pull requests only: forks get a read-only token, so they only see the job summary.
      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('ci-summary.md', 'utf8');
            const marker = '<!-- playlish-ci-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: |
            test-results.json
            coverage/
            ci-summary.md
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Install scripts run here: the suite drives the real Electron binary. No browsers are downloaded, and the app
      # talks only to the fake Spotify on 127.0.0.1 (end-to-end test mode, see src/main/e2e.ts).
      - name: Install dependencies (with the Electron binary)
        run: npm ci

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npx playwright test

      # Flaky tests (passed only on the retry) are listed here instead of disappearing into a green run.
      - name: Write summary
        if: always()
        shell: bash
        run: node scripts/e2e-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      # Failed or flaky tests on main become issues (#14), one per failure, as github-actions[bot] with the built-in token.
      # Pull request failures are not filed: they are in the pull request's own summary.
      - name: File issues for failed or flaky tests
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON tools/issues/ci-report.ts --playwright e2e-results/results.json

      # Screenshots, app logs and Playwright traces of failed tests (open a trace with npx playwright show-trace).
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: |
            e2e-results/
            e2e-report/
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: Performance budgets
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Install scripts run here: the harness needs the real Electron binary.
      - name: Install dependencies (with the Electron binary)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Idle tray
        run: node tools/perf/run.ts --scenario idle --out perf-idle.json --no-fail

      - name: UI open
        run: node tools/perf/run.ts --scenario ui --out perf-ui.json --no-fail

      # With the example plugins on (#104). Report only until the owner settles the allowance for the plugin process.
      - name: Idle tray with plugins
        run: node tools/perf/run.ts --scenario idle --plugins --advisory --out perf-idle-plugins.json --no-fail

      - name: Baseline from main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$id" ]; then gh run download "$id" --repo "$GITHUB_REPOSITORY" --name perf-results --dir perf-baseline || echo "No baseline on main yet."; fi

      - name: Write report
        if: always()
        shell: bash
        run: |
          node tools/perf/compare.ts --current . --baseline perf-baseline > perf-summary.md
          cat perf-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('perf-summary.md')) return;
            const body = fs.readFileSync('perf-summary.md', 'utf8');
            const marker = '<!-- playlish-perf-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Results from main become the baseline that pull requests compare against.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: |
            perf-idle.json
            perf-ui.json
            perf-summary.md
          if-no-files-found: ignore
          retention-days: 90
