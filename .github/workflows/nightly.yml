name: Nightly

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: Full suite and dependency audit
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests with coverage
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=test-results.json

      - name: Build
        run: npm run build

      # Nightly audit is stricter than the pull request one: any advisory level fails, except the ones reviewed and
      # accepted (with a reason and an expiry date) in audit-exceptions.json.
      - name: Dependency audit (all levels)
        run: node scripts/audit.mjs

      - name: Write summary
        if: always()
        shell: bash
        run: |
          node scripts/ci-summary.mjs ci-summary.md
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"

      # Failed or flaky tests in the nightly run become issues (#14), as github-actions[bot] with the built-in token.
      - name: File issues for failed or flaky tests
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON tools/issues/ci-report.ts --vitest test-results.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-reports
          path: |
            test-results.json
            coverage/
            ci-summary.md
          if-no-files-found: ignore
          retention-days: 30

  soak:
    name: Soak test (60 minutes)
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (with the Electron binary)
        run: npm ci

      - name: Build
        run: npm run build

      # The main process's native memory grows for about the first 35 minutes of window open/close cycles and then
      # levels off (measured 2026-10-06: 81 to 88 MB, then 88.4 to 88.8 MB over the last 23 minutes; the JS heap stays
      # flat). A 30-minute run only sees the rise, so the growth trend is judged on the second half of a 60-minute run.
      - name: Soak
        run: node tools/perf/run.ts --scenario soak --minutes 60 --warmup 0.5 --out perf-soak.json

      - name: Write report
        if: always()
        shell: bash
        run: |
          node tools/perf/compare.ts --current . > perf-summary.md
          cat perf-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-results
          path: |
            perf-soak.json
            perf-summary.md
          if-no-files-found: ignore
          retention-days: 90

  soak-plugins:
    name: Soak test with plugins (60 minutes)
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (with the Electron binary)
        run: npm ci

      - name: Build
        run: npm run build

      # The same soak with the example plugins on (#104): the soak driver's playback events reach them all the time.
      # Report only until the owner settles the allowance for the plugin process; a plugin turned off is still reported.
      - name: Soak with plugins
        run: node tools/perf/run.ts --scenario soak --minutes 60 --warmup 0.5 --plugins --advisory --out perf-soak-plugins.json

      - name: Write report
        if: always()
        shell: bash
        run: |
          node tools/perf/compare.ts --current . > perf-summary.md
          cat perf-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-plugins-results
          path: |
            perf-soak-plugins.json
            perf-summary.md
          if-no-files-found: ignore
          retention-days: 90
