<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Playlish (spike)</title>
  <style>
    :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #666666; --panel: #f2f2f2; --accent: #1db954; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #f0f0f0; --muted: #a0a0a0; --panel: #1f1f1f; }
    }
    body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border-radius: 8px; padding: 12px; margin: 12px 0; }
    button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--muted); background: var(--bg); color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #000; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    progress { width: 100%; height: 6px; appearance: none; border: 0; border-radius: 3px; overflow: hidden; background: var(--bg); }
    progress::-webkit-progress-bar { background: var(--bg); border-radius: 3px; }
    progress::-webkit-progress-value { background: var(--accent); border-radius: 3px; }
    #track { font-weight: 600; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <h1>Playlish <span class="muted">spike</span></h1>
  <div id="status" class="muted">Starting…</div>

  <div class="panel" id="configPanel" hidden></div>

  <div class="panel" id="crashPanel" hidden>
    <div id="crashText"></div>
    <div class="row" style="margin-top:8px">
      <button id="crashReport" class="primary">Report it</button>
      <button id="crashDismiss">Dismiss</button>
    </div>
  </div>

  <div class="panel row">
    <button id="login" class="primary">Log in with Spotify</button>
    <button id="play" disabled>Play test track</button>
  </div>

  <div class="panel">
    <div id="track">Nothing playing</div>
    <div id="artists" class="muted">&nbsp;</div>
    <progress id="progress" max="1" value="0"></progress>
    <div class="row">
      <button id="prev" disabled>⏮</button>
      <button id="toggle" disabled>⏯</button>
      <button id="fade" disabled>Fade ⏯</button>
      <button id="next" disabled>⏭</button>
      <label class="row">Vol <input id="volume" type="range" min="0" max="100" value="50" disabled></label>
    </div>
  </div>

  <div class="panel">
    <div><strong>Resources</strong> <span class="muted">(all processes, sampled every 5 s)</span></div>
    <div id="metrics" class="muted">Waiting for first sample…</div>
    <div class="muted">Log: <code id="logPath"></code></div>
  </div>

  <div class="panel row">
    <button id="reportIssue">Report an issue</button>
    <button id="exportDiagnostics">Export diagnostics</button>
  </div>

  <script type="module" src="/ui.js"></script>
</body>
</html>
